name: nf-test

on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "mkdocs.yml"
      - "**/meta.yml"
      - "**/*.md"
      - "**/*.png"
      - "**/*.svg"
  push:
    branches: [master]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      test_path:
        description: "Limit nf-test to this path, e.g. subworkflows/local/assemble_short. Blank runs the whole suite."
        required: false
        default: ""

# A newer run on the same branch cancels this one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NXF_ANSI_LOG: false
  NFT_VER: "0.9.5"
  NFT_WORKDIR: "~"

jobs:
  nf-test:
    name: "nf-test | Nextflow ${{ matrix.NXF_VER }}"
    runs-on: ubuntu-latest
    # The MitoHiFi container alone is ~7 GB and the suite runs two real assemblies.
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        NXF_VER:
          - "25.10.4"
          - "latest-everything"

    steps:
      - uses: actions/checkout@v5

      # The MitoHiFi image plus the work directories do not fit on a stock runner.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force
          df -h /

      - name: Install Nextflow
        uses: nf-core/setup-nextflow@v3
        with:
          version: "${{ matrix.NXF_VER }}"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install nf-test
        uses: nf-core/setup-nf-test@v2
        with:
          version: "${{ env.NFT_VER }}"
          install-pdiff: true

      # The test data is real published data, fetched rather than committed.
      # bin/fetch_testdata.sh verifies the Illumina reads against published md5 sums.
      - name: Fetch test data
        run: bin/fetch_testdata.sh

      - name: Run nf-test
        id: nf_test
        # Nextflow's edge release is allowed to fail without failing the workflow.
        continue-on-error: ${{ matrix.NXF_VER == 'latest-everything' }}
        # Via the environment, not string interpolation, so a dispatch input cannot
        # inject shell. nf-test.config already sets `profile = "test,docker"`.
        env:
          TEST_PATH: ${{ inputs.test_path }}
        run: nf-test test ${TEST_PATH} --ci --verbose --tap=test.tap

      # When a test fails here it is almost never the pipeline logic - it is the
      # environment, and the evidence lives in files that die with the runner.
      # Print enough of it that the next failure explains itself.
      - name: Diagnostics on failure
        if: ${{ always() && steps.nf_test.outcome == 'failure' }}
        run: |
          echo "::group::Test data that was fetched"
          ls -laR testdata/ || true
          for f in testdata/illumina/PZ790849.fasta testdata/illumina/PZ790849.gb \
                   testdata/hifi/MW539688.1.fasta testdata/contigs/NC_016067.1.fasta; do
            echo "--- ${f} ($(wc -c < "${f}" 2>/dev/null || echo 0) bytes) ---"
            head -n 2 "${f}" 2>/dev/null || echo "MISSING"
          done
          echo "::endgroup::"

          # GetOrganelle's own log points at slim.log.txt for the real error, and the
          # label database it slims against is built by a separate task, so both have
          # to be captured or the failure is unreadable.
          # Name the logs wanted rather than globbing *.log: Nextflow's own binary
          # cache under .nextflow/ holds dozens of .log files and swallowed the
          # budget last time, so the assembler log never got printed.
          echo "::group::Assembler logs"
          find . \( -name "*get_org.log.txt" -o -name "slim.log.txt" \) \
               -not -path "*/.nextflow/*" 2>/dev/null \
            | while read -r log; do
                echo "===== ${log} ($(wc -c < "${log}") bytes) ====="
                cat "${log}"
              done
          echo "::endgroup::"

          echo "::group::MitoHiFi logs"
          find . -name "*.log" -path "*output*" -not -path "*/.nextflow/*" -size +0 2>/dev/null \
            | head -10 | while read -r log; do
                echo "===== ${log} ====="
                tail -n 30 "${log}"
              done
          echo "::endgroup::"

          echo "::group::GetOrganelle databases"
          find . -type d -name "LabelDatabase" -o -type d -name "SeedDatabase" 2>/dev/null \
            | head -10 | while read -r db; do
                echo "===== ${db} ====="
                ls -la "${db}"
                [ -f "${db}/VERSION" ] && cat "${db}/VERSION"
              done
          echo "::endgroup::"

          echo "::group::Failed task stderr"
          find . -name ".command.err" -size +0 2>/dev/null | head -20 | while read -r err; do
            echo "===== ${err} ====="
            tail -n 30 "${err}"
          done
          echo "::endgroup::"

          echo "::group::Disk"
          df -h /
          echo "::endgroup::"

      - name: Summarise
        if: always()
        run: |
          passed=0; failed=0
          if [ -f test.tap ]; then
            passed=$(grep -c '^ok ' test.tap || true)
            failed=$(grep -c '^not ok ' test.tap || true)
          fi
          {
            echo "## nf-test | Nextflow ${{ matrix.NXF_VER }}"
            echo ""
            # Spell the tally out. This leg can be non-blocking, and a green job
            # that quietly contains failed tests is worse than a red one.
            echo "**${passed} passed, ${failed} failed.**"
            if [ "${failed}" -gt 0 ] && [ "${{ matrix.NXF_VER }}" = "latest-everything" ]; then
              echo ""
              echo "> This leg does not block CI, so the job above may still show green."
            fi
            echo ""
            if [ -f test.tap ]; then
              echo "| | Test |"
              echo "|:-:|---|"
              sed -n 's/^ok [0-9]* - \(.*\)$/| ✅ | \1 |/p; s/^not ok [0-9]* - \(.*\)$/| ❌ | \1 |/p' test.tap
            else
              echo "No test results were produced."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail on a pinned-version failure
        if: ${{ always() && steps.nf_test.outcome == 'failure' && matrix.NXF_VER != 'latest-everything' }}
        run: exit 1

      - name: Warn on an edge-version failure
        if: ${{ always() && steps.nf_test.outcome == 'failure' && matrix.NXF_VER == 'latest-everything' }}
        run: echo "::warning::nf-test failed on Nextflow ${{ matrix.NXF_VER }}. This does not fail CI, but it is worth looking at."
