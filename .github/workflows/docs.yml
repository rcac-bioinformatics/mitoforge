name: Documentation

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# Allow one concurrent deployment, and let a new push cancel one in progress.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          # Astro 7 requires Node >= 22.12. Keep this in step with what a
          # developer gets from .tools/, so the site builds the same in both.
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      # Astro has no equivalent of `mkdocs build --strict`, so the link check is
      # explicit: every internal href in the built HTML has to resolve to a page or
      # an asset that exists. A pull request that breaks a link fails here.
      - name: Check internal links
        run: node scripts/check-links.mjs

      # Everything but a pull request deploys: a push to master, and a manual
      # workflow_dispatch. Gating on `push` alone made a dispatched run build the
      # site, upload nothing, and still report success.
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
