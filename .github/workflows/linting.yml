name: Linting

on:
  pull_request:
  push:
    branches: [master]
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Nextflow
        uses: nf-core/setup-nextflow@v3

      - name: Setup uv
        uses: astral-sh/setup-uv@v9

      # .pre-commit-config.yaml has a local hook that shells out to nf-core, so the
      # version pinned in .nf-core.yml has to be on the PATH before the hooks run.
      - name: Install nf-core
        run: |
          NF_CORE_VERSION=$(grep '^nf_core_version:' .nf-core.yml | awk '{print $2}')
          uv tool install "nf-core==${NF_CORE_VERSION}"

      - uses: pre-commit/action@v3.0.1

  nf-core-lint:
    name: nf-core pipelines lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Nextflow
        uses: nf-core/setup-nextflow@v3

      - name: Setup uv
        uses: astral-sh/setup-uv@v9

      - name: Install nf-core
        run: |
          NF_CORE_VERSION=$(grep '^nf_core_version:' .nf-core.yml | awk '{print $2}')
          uv tool install "nf-core==${NF_CORE_VERSION}"

      # --release additionally checks that the version number is not a dev version.
      - name: Lint
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            nf-core -l lint_log.txt pipelines lint --release --dir "${GITHUB_WORKSPACE}" --markdown lint_results.md
          else
            nf-core -l lint_log.txt pipelines lint --dir "${GITHUB_WORKSPACE}" --markdown lint_results.md
          fi

      - name: Upload lint results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-results
          path: |
            lint_log.txt
            lint_results.md
