site_name: mitoforge
site_description: Assemble, circularise and annotate animal mitochondrial genomes from PacBio HiFi or Illumina paired-end reads.
site_author: Arun Seetharam
site_url: https://rcac-bioinformatics.github.io/mitoforge/
repo_url: https://github.com/rcac-bioinformatics/mitoforge
repo_name: rcac-bioinformatics/mitoforge
edit_uri: edit/master/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - content.code.copy
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.highlight
    - toc.follow

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - def_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Quick start: quick-start.md
  - Samplesheet: samplesheet.md
  - Cases:
      - Overview: cases/index.md
      - HiFi with an NCBI reference: cases/hifi-ncbi-reference.md
      - HiFi from a PacBio BAM: cases/hifi-from-bam.md
      - Short reads with your own reference: cases/short-reads.md
      - Short reads using HiFi mitogenomes: cases/short-reads-from-hifi.md
      - Many species at once: cases/many-species.md
      - Heteroplasmy and NUMTs: cases/heteroplasmy-and-numts.md
      - On a laptop with Docker: cases/laptop.md
      - When a sample fails: cases/failed-sample.md
  - Output reference: output.md
  - Troubleshooting: troubleshooting.md
  - Citations: citations.md
  - Developer guide:
      - Overview: developer/index.md
      - Adding a stage: developer/extending.md
      - Adding an assembler: developer/adding-an-assembler.md
      - Adding a cluster profile: developer/adding-a-cluster-profile.md
      - Roadmap: developer/roadmap.md
      - Contributing: CONTRIBUTING.md

# docs/README.md is for people reading the repository on GitHub; the built site has
# index.md instead, and the two would collide.
exclude_docs: |
  README.md

not_in_nav: |
  usage.md
