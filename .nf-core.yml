repository_type: pipeline

nf_core_version: 4.1.0

lint:
  files_unchanged:
    - .github/workflows/linting.yml
    - docs/CONTRIBUTING.md
    - docs/CONTRIBUTING.md
    - CODE_OF_CONDUCT.md
    - assets/nf-core-mitoforge_logo_light.png
    - docs/images/nf-core-mitoforge_logo_light.png
    - docs/images/nf-core-mitoforge_logo_dark.png
    - .github/ISSUE_TEMPLATE/bug_report.yml
    - .github/PULL_REQUEST_TEMPLATE.md
    - assets/email_template.txt
    - docs/README.md
    - .prettierignore
    - .prettierignore
  nextflow_config:
    - manifest.name
    - manifest.homePage
    - process.cpus
    - process.memory
    - process.time
  multiqc_config:
    - report_comment
  container_configs: false
  files_exist:
    # The documentation moved to src/content/docs/ when the site became Starlight.
    # docs/README.md points at it.
    - docs/CONTRIBUTING.md
    - docs/output.md
    - docs/usage.md
    - .github/actions/get-shards/action.yml
    - .github/actions/nf-test/action.yml
    - ro-crate-metadata.json
    - .github/.dockstore.yml
    - .github/workflows/branch.yml
    - .github/workflows/pr-comment.yml
    - .github/workflows/clean-up.yml
    - .github/workflows/download_pipeline.yml
    - .github/workflows/fix_linting.yml
    - .github/workflows/template-version-comment.yml
    - conf/test_full.config
    - conf/igenomes.config
    - conf/igenomes_ignored.config
    - CODE_OF_CONDUCT.md
    - assets/nf-core-mitoforge_logo_light.png
    - docs/images/nf-core-mitoforge_logo_light.png
    - docs/images/nf-core-mitoforge_logo_dark.png
    - .github/ISSUE_TEMPLATE/config.yml
    - .github/workflows/awstest.yml
    - .github/workflows/awsfulltest.yml
    - conf/igenomes.config
    - assets/email_template.html
    - assets/sendmail_template.txt
    - assets/email_template.txt
  readme:
    - nextflow_badge
    - nfcore_template_badge
  included_configs: false

template:
  org: rcac-bioinformatics
  name: mitoforge
  description: Assemble, circularise and annotate animal mitochondrial genomes from PacBio HiFi or Illumina paired-end reads.
  author: Arun Seetharam
  version: 0.1.0
  force: true
  outdir: .
  skip_features:
    - github_badges
    - igenomes
    - fastqc
    - nf_core_configs
    - seqera_platform
    - gpu
    - codespaces
    - vscode
    - rocrate
    - email
  is_nfcore: false
